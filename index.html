<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Foto a Historia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foto Historia">
<style>
  :root{
    --bg: #0a0a0a;
    --panel: #141414;
    --line: #262626;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #ff5a3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;
    overscroll-behavior:none;
  }
  .wrap{
    max-width:520px; margin:0 auto;
    padding: env(safe-area-inset-top,16px) 16px calc(env(safe-area-inset-bottom,12px) + 10px);
    height:100dvh;
    display:flex; flex-direction:column;
  }
  header{ padding: 4px 2px 10px; flex-shrink:0; }
  h1{
    font-size:14px; font-weight:600; letter-spacing:0.02em;
    margin:0; color:var(--text);
    text-transform:uppercase;
  }
  .sub{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  .stage{
    position:relative;
    width:auto;
    flex:1 1 auto;
    min-height:0;
    aspect-ratio: 9/16;
    max-width:100%;
    max-height:100%;
    margin:0 auto;
    background:#000;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage .empty{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:0 40px;
    line-height:1.5;
    pointer-events:none;
  }
  .stage .empty svg{ display:block; margin:0 auto 12px; opacity:0.35; }

  #viewCanvas{
    width:100%;
    height:100%;
    display:block;
  }
  #viewCanvas.active{
    touch-action:none;
  }

  .change-btn{
    position:absolute;
    top:10px; right:10px;
    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(6px);
    color:var(--text);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:8px 14px;
    font-size:12.5px;
    font-weight:600;
    display:none;
    align-items:center;
    gap:6px;
    cursor:pointer;
    z-index:2;
  }
  .change-btn:active{ transform:scale(0.96); }

  .hint{
    position:absolute;
    bottom:10px; left:0; right:0;
    text-align:center;
    font-size:11px;
    color:rgba(255,255,255,0.55);
    pointer-events:none;
    transition:opacity 0.3s ease;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
    flex-shrink:0;
  }
  input[type=file]{ display:none; }

  button, label.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:12px 16px;
    border-radius:12px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: transform 0.06s ease, opacity 0.15s ease;
    -webkit-user-select:none; user-select:none;
  }
  button:active, label.btn:active{ transform: scale(0.98); }

  .btn-primary{
    background:var(--accent);
    color:#111;
  }
  .btn-secondary{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
  }
  .btn-ig{
    background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    color:#fff;
  }
  .btn-secondary:disabled, .btn-ig:disabled{
    opacity:0.35;
    pointer-events:none;
  }

  .status{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-top:6px;
    min-height:14px;
    flex-shrink:0;
  }
  .status.ok{ color:#4ade80; }

  canvas#exportCanvas{ display:none; }

  footer{
    margin-top:4px;
    padding-top:2px;
    text-align:center;
    font-size:10px;
    color:#4a4a4a;
    flex-shrink:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Foto → Historia</h1>
    <div class="sub">Fondo negro · 1080×1920 · sin pérdida de calidad</div>
  </header>

  <div class="stage" id="stage">
    <div class="empty" id="emptyState">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      Elegí una foto para verla acá
    </div>
    <canvas id="viewCanvas" width="1080" height="1920" style="display:none;"></canvas>
    <label class="change-btn" id="changeBtn" for="fileInput">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      Cambiar foto
    </label>
    <div class="hint" id="hint" style="display:none;">Arrastrá para mover · pellizcá para agrandar · doble toque centra</div>
  </div>

  <canvas id="exportCanvas" width="1080" height="1920"></canvas>

  <div class="actions">
    <input type="file" id="fileInput" accept="image/*">
    <label class="btn btn-primary" for="fileInput">Elegir foto</label>
    <button class="btn-ig" id="shareBtn" disabled>Compartir a Instagram</button>
    <button class="btn-secondary" id="downloadBtn" disabled>Descargar imagen</button>
  </div>

  <div class="status" id="status"></div>

  <footer>Se procesa en tu teléfono. Nada se sube a internet.</footer>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const stage = document.getElementById('stage');
const emptyState = document.getElementById('emptyState');
const viewCanvas = document.getElementById('viewCanvas');
const vctx = viewCanvas.getContext('2d');
const hint = document.getElementById('hint');
const changeBtn = document.getElementById('changeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const shareBtn = document.getElementById('shareBtn');
const statusEl = document.getElementById('status');
const exportCanvas = document.getElementById('exportCanvas');
const ectx = exportCanvas.getContext('2d');

const W = 1080, H = 1920;
let currentImg = null;
let currentFileName = 'foto';

let baseScale = 1;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

const MIN_SCALE = 0.5;
const MAX_SCALE = 4;
const SNAP_THRESHOLD = 28; // px de canvas: radio donde empieza a "sentirse" el imán
const SNAP_STRENGTH = 0.65; // 0 = sin resistencia, 1 = pegado del todo

function applyMagneticSnapX(rawOffsetX){
  const dist = Math.abs(rawOffsetX);
  if (dist >= SNAP_THRESHOLD) return rawOffsetX;
  // Cuanto más cerca del centro, más se resiste a alejarse: función suave (ease)
  const t = dist / SNAP_THRESHOLD; // 0 en el centro, 1 en el borde de la zona
  const eased = t * t; // acelera la resistencia cerca del centro
  const pulledDist = dist * (eased + (1 - eased) * (1 - SNAP_STRENGTH));
  return rawOffsetX >= 0 ? pulledDist : -pulledDist;
}

function setStatus(msg, ok){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (ok ? ' ok' : '');
}

function drawTo(ctx, img){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0,0,W,H);

  const s = baseScale * scale;
  const drawW = img.width * s;
  const drawH = img.height * s;
  const dx = (W - drawW) / 2 + offsetX;
  const dy = (H - drawH) / 2 + offsetY;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, dx, dy, drawW, drawH);
}

function render(){
  if (!currentImg) return;
  drawTo(vctx, currentImg);
}

function clampOffsets(){
  const s = baseScale * scale;
  const drawW = currentImg.width * s;
  const drawH = currentImg.height * s;
  const maxOffX = Math.max(drawW / 2, W / 2);
  const maxOffY = Math.max(drawH / 2, H / 2);
  offsetX = Math.max(-maxOffX, Math.min(maxOffX, offsetX));
  offsetY = Math.max(-maxOffY, Math.min(maxOffY, offsetY));
}

function resetTransform(img){
  baseScale = Math.min(W / img.width, H / img.height);
  scale = 1;
  offsetX = 0;
  offsetY = 0;
}

let pointers = new Map();
let gestureStart = null;
let lastTapTime = 0;
let lastTapPos = null;

function canvasCoordsFromEvent(e){
  const rect = viewCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);
  return {x, y};
}

function animateOffsetYTo(target){
  const start = offsetY;
  const duration = 220;
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    offsetY = start + (target - start) * eased;
    render();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

viewCanvas.addEventListener('pointerdown', (e) => {
  if (!currentImg) return;
  viewCanvas.setPointerCapture(e.pointerId);
  const pos = canvasCoordsFromEvent(e);
  pointers.set(e.pointerId, pos);
  hint.style.opacity = '0';

  if (pointers.size === 1) {
    // Detección de doble tap: dos toques rápidos y cercanos entre sí
    const now = Date.now();
    const isDoubleTap = (now - lastTapTime) < 300 &&
      lastTapPos && Math.hypot(pos.x - lastTapPos.x, pos.y - lastTapPos.y) < 60;

    if (isDoubleTap) {
      animateOffsetYTo(0); // centra solo el eje vertical, mantiene zoom y X
      lastTapTime = 0;
      lastTapPos = null;
      gestureStart = null;
      return;
    }
    lastTapTime = now;
    lastTapPos = pos;

    const p = [...pointers.values()][0];
    gestureStart = { type: 'drag', x: p.x, y: p.y, offsetX, offsetY };
  } else if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    gestureStart = { type: 'pinch', dist, scale, offsetX, offsetY };
  }
});

viewCanvas.addEventListener('pointermove', (e) => {
  if (!currentImg || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, canvasCoordsFromEvent(e));

  if (pointers.size === 1 && gestureStart && gestureStart.type === 'drag') {
    const p = [...pointers.values()][0];
    const rawOffsetX = gestureStart.offsetX + (p.x - gestureStart.x);
    offsetX = applyMagneticSnapX(rawOffsetX);
    offsetY = gestureStart.offsetY + (p.y - gestureStart.y);
    clampOffsets();
    render();
  } else if (pointers.size === 2 && gestureStart && gestureStart.type === 'pinch') {
    const [p1, p2] = [...pointers.values()];
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const ratio = dist / (gestureStart.dist || 1);
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, gestureStart.scale * ratio));
    clampOffsets();
    render();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size === 1) {
    const p = [...pointers.values()][0];
    gestureStart = { type: 'drag', x: p.x, y: p.y, offsetX, offsetY };
  } else if (pointers.size === 0) {
    gestureStart = null;
    hint.style.opacity = '1';
  }
}
viewCanvas.addEventListener('pointerup', endPointer);
viewCanvas.addEventListener('pointercancel', endPointer);
viewCanvas.addEventListener('pointerleave', (e) => {
  if (pointers.has(e.pointerId)) endPointer(e);
});

function loadImageFile(file) {
  setStatus('Procesando…');
  currentFileName = (file.name || 'foto').replace(/\.[^/.]+$/, '') || 'foto';

  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      currentImg = img;
      resetTransform(img);
      render();

      viewCanvas.style.display = 'block';
      viewCanvas.classList.add('active');
      emptyState.style.display = 'none';
      hint.style.display = 'block';
      changeBtn.style.display = 'flex';

      downloadBtn.disabled = false;
      shareBtn.disabled = false;
      setStatus('Listo. Arrastrá o pellizcá para ajustar.', true);
    };
    img.onerror = () => setStatus('No se pudo leer esa imagen. Probá con otra.');
    img.src = ev.target.result;
  };
  reader.onerror = () => setStatus('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadImageFile(file);
});

function exportBlob(callback){
  if (!currentImg) return;
  drawTo(ectx, currentImg);
  exportCanvas.toBlob((blob) => {
    callback(blob);
  }, 'image/png', 1.0);
}

downloadBtn.addEventListener('click', () => {
  if (!currentImg) return;
  exportBlob((blob) => {
    if (!blob) { setStatus('Error al generar la imagen.'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFileName + '_historia.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    setStatus('Imagen descargada ✓', true);
  });
});

shareBtn.addEventListener('click', () => {
  if (!currentImg) return;
  setStatus('Generando…');

  exportBlob(async (blob) => {
    if (!blob) { setStatus('Error al generar la imagen.'); return; }

    const file = new File([blob], currentFileName + '_historia.png', { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Foto Historia'
        });
        setStatus('Compartido ✓', true);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') {
          setStatus('Cancelado.');
          return;
        }
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFileName + '_historia.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    setStatus('No se pudo compartir directo. Imagen descargada — subila desde tu galería.');
  });
});

async function checkForSharedPhoto() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('fromShare') !== '1') return;

  try {
    const cache = await caches.open('foto-historia-shared');
    const response = await cache.match('/shared-photo');
    if (response) {
      const blob = await response.blob();
      const file = new File([blob], 'foto-compartida.jpg', { type: blob.type || 'image/jpeg' });
      loadImageFile(file);
      await cache.delete('/shared-photo');
    }
    window.history.replaceState({}, '', window.location.pathname);
  } catch (e) {
    setStatus('No se pudo cargar la foto compartida.');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      checkForSharedPhoto();

      // Si ya había un service worker activo antes de este registro,
      // y ahora se instala uno nuevo, significa que hay una actualización.
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // Hay una versión nueva lista: la activamos y recargamos solos
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });

      // Revisa si hay una actualización disponible cada vez que se abre la app
      reg.update();
    }).catch(() => {});

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
